<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sound Board</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%237fbf5a%22/%3E%3C/svg%3E" />
  <style>
    :root { --bg: #0b0d0f; --panel: #14181b; --line: #2a3238; --text: #c9d4c5; --dim: #7d8a80; --accent: #7fbf5a; --warn: #e0a040; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 'Share Tech Mono', monospace; }
    main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; }
    header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
    h1 { font-size: 16px; margin: 0; color: var(--accent); letter-spacing: 1px; }
    h2 { font-size: 12px; margin: 14px 0 6px; color: var(--dim); letter-spacing: 1px; }
    header p { margin: 0; color: var(--dim); flex: 1 1 320px; }
    section { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; min-width: 0; }
    button { background: #1c2226; color: var(--text); border: 1px solid var(--line); font: inherit; padding: 4px 8px; cursor: pointer; }
    button:hover { border-color: var(--dim); }
    button.on { border-color: var(--accent); color: var(--accent); }
    .seg { display: inline-flex; }
    .seg button + button { border-left: 0; }
    .events { display: flex; flex-wrap: wrap; gap: 4px; }
    .take { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 4px 10px; padding: 6px 0; border-top: 1px solid var(--line); }
    .take:first-of-type { border-top: 0; }
    .take b { color: var(--accent); font-weight: normal; overflow-wrap: anywhere; }
    .take small { display: block; color: var(--dim); }
    .takes { display: flex; flex-wrap: wrap; gap: 4px; }
    .takes button { padding: 2px 6px; }
    .src { grid-column: 2; color: var(--dim); font-size: 11px; }
    .src a { color: var(--dim); }
    .src a:hover { color: var(--accent); }
    label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
    #status { color: var(--warn); }
    @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } .take { grid-template-columns: minmax(0, 1fr); } .src { grid-column: 1; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SOUND BOARD</h1>
      <p>Game events play exactly what the game plays for them. Every recording is CC0 - sources in public/assets/audio/CREDITS.md.</p>
      <span class="seg" id="mode"><button data-mode="rec" class="on">Recorded</button><button data-mode="synth">Synth</button></span>
      <button id="amb" class="on">Ambience on</button>
      <label>position <input id="pos" type="range" min="-30" max="30" step="1" value="0" /></label>
      <span id="status">click anything to start audio</span>
    </header>
    <section><div id="events"></div></section>
    <section><h2 style="margin-top:0">EVERY TAKE <small>(hover a take for its source)</small></h2><div id="takes"></div></section>
  </main>
  <script type="module" src="/src/sfxboard.js"></script>
</body>
</html>
