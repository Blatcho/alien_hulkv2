<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>model preview</title>
<style>html,body{margin:0;background:#1e2024;color:#ddd;font:12px monospace}canvas{image-rendering:pixelated;display:block}#info{position:fixed;left:8px;top:8px}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
</head>
<body>
<div id="info"></div>
<script type="module">
// Renders one GLB from assets/models with the game's conventions (ortho, 3/4 yaw, pixel scale) so
// the Blender scripts can be checked by eye:  tools/preview.html?model=marine&clip=walk&t=0.25
// window.__show(clip, t, yaw) re-poses it; window.__ready flips when the model is loaded.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const model = q.get('model') || 'marine';
const SIZE = Number(q.get('size') || 160);           // art pixels of the square view
const SCALE = Number(q.get('scale') || 3);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(SIZE, SIZE, false);
renderer.domElement.style.width = SIZE * SCALE + 'px'; renderer.domElement.style.height = SIZE * SCALE + 'px';
renderer.setClearColor(0x1e2024);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-SIZE / 2, SIZE / 2, SIZE / 2, -SIZE / 2, -1000, 1000);
camera.position.set(0, 0, 500);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xfff0dd, 1.6); key.position.set(0.6, 1, 1); scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.5); fill.position.set(-1, 0.2, 0.6); scene.add(fill);
const grid = new THREE.GridHelper(SIZE, SIZE / 16, 0x333a44, 0x2a2f38); grid.rotation.x = Math.PI / 2; grid.position.z = -40; scene.add(grid);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, 2), new THREE.MeshBasicMaterial({ color: 0x556 })); floor.position.y = -SIZE * 0.4; scene.add(floor);
let root, mixer, meta, actions = {};
const loader = new GLTFLoader();
loader.load(`../assets/models/${model}.glb`, async (gltf) => {
  meta = await (await fetch(`../assets/models/${model}.meta.json`)).json();
  root = gltf.scene;
  root.traverse((o) => { if (o.isMesh) { o.material.vertexColors = true; o.frustumCulled = false; } });
  root.position.y = -SIZE * 0.4;
  root.rotation.y = Number(q.get('yaw') || 0.6);
  scene.add(root);
  mixer = new THREE.AnimationMixer(root);
  for (const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
  document.getElementById('info').textContent = `${model}: ${gltf.animations.map((a) => a.name).join(' ')}`;
  window.__clips = gltf.animations.map((a) => ({ name: a.name, duration: a.duration, tracks: a.tracks.length }));
  window.__show(q.get('clip') || 'idle', Number(q.get('t') || 0), Number(q.get('yaw') || 0.6));
  window.__ready = true;
});
window.__show = (clip, t = 0, yaw = 0.6) => {
  for (const a of Object.values(actions)) a.stop();
  const a = actions[clip];
  root.rotation.y = yaw;
  if (a) { a.reset(); a.play(); a.paused = true; a.time = Math.min(a.getClip().duration, t * a.getClip().duration); mixer.update(0); }
  renderer.render(scene, camera);
};
</script>
</body>
</html>
