<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asset Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%237fbf5a%22/%3E%3C/svg%3E" />
  <style>
    :root { --bg: #0b0d0f; --panel: #14181b; --line: #2a3238; --text: #c9d4c5; --accent: #7fbf5a; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 'Share Tech Mono', monospace; }
    #stage { position: fixed; inset: 0; }
    #panel { position: fixed; top: 12px; left: 12px; width: 240px; max-height: calc(100% - 24px); overflow: auto;
      background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); padding: 10px; }
    h1 { font-size: 14px; margin: 0 0 8px; color: var(--accent); letter-spacing: 1px; }
    h2 { font-size: 12px; margin: 12px 0 4px; opacity: .7; }
    button { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 4px 6px; background: #1c2226;
      color: var(--text); border: 1px solid var(--line); font: inherit; cursor: pointer; }
    button.on { border-color: var(--accent); color: var(--accent); }
    #stats { margin-top: 10px; white-space: pre; opacity: .8; }
    label { display: block; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="panel">
    <h1>ASSET VIEWER</h1>
    <h2>MODELS</h2><div id="models"></div>
    <h2>CLIPS</h2><div id="clips"></div>
    <label>speed <input id="speed" type="range" min="0" max="2" step="0.05" value="1" /></label>
    <label><input id="turn" type="checkbox" /> turntable</label>
    <div id="stats"></div>
  </div>
  <script type="module" src="/src/viewer.js"></script>
</body>
</html>
