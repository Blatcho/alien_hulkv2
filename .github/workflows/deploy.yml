# Continuous deployment of Hull Breach to https://blatcho.com/games/ahulk/ over FTPS.
#
# Runs on every push to main (and on demand from the Actions tab): installs, runs the tests, builds
# the production bundle with a relative base, and mirrors dist/ to the server folder, uploading only
# what changed since the last deploy and deleting files an earlier deploy put there that the build no
# longer has. Files in the folder that this action never uploaded are left alone.
#
# Required repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER    hostname of the FTP server, e.g. ftp.blatcho.com (no protocol, no path)
#   FTP_USERNAME  FTP login
#   FTP_PASSWORD  FTP password
# Optional repository variables (Settings → Secrets and variables → Actions → Variables - a secret
# of the same name is NOT read):
#   FTP_SERVER_DIR  remote path of the game's folder as seen by the FTP account, with a trailing
#                   slash. Defaults to ahulk/ because the FTP account's home directory is
#                   public_html/blatcho.com/games. Set it if the account lands somewhere else
#                   (./ for an account whose home is the game's folder itself).
#   FTP_PROTOCOL    ftps (default, explicit TLS on port 21), ftp (plain, only if the host has no
#                   TLS) or ftps-legacy (implicit TLS on port 990).
#   FTP_PORT        defaults to 21 (use 990 for ftps-legacy).

name: Deploy to blatcho.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: overlapping uploads would race on the server's sync-state file.
concurrency:
  group: deploy-ahulk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and FTP deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # A failing test stops the deploy, so the live site never gets a broken build.
      - name: Run tests
        run: npm test

      # Relative base: the build works from the domain root or any subfolder.
      - name: Build
        run: npm run build -- --base=./

      # Where this deploy goes, for the log: the repository variable when it is set, else the default.
      - name: Deploy target
        env:
          DIR_VAR: ${{ vars.FTP_SERVER_DIR }}
        run: echo "FTP_SERVER_DIR variable: ${DIR_VAR:-(unset, using the workflow default ahulk/)}"

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          # Relative to the FTP account's home folder (the games folder); must end with "/".
          server-dir: ${{ vars.FTP_SERVER_DIR || 'ahulk/' }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
